<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e17" />
  <title>Brasil Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js vendorizado localmente (offline, sem CDN) via Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <!-- Camada de fundo 3D (Three.js) -->
  <canvas id="bg-canvas"></canvas>

  <!-- Vinheta e brilho ambiente -->
  <div class="ambient-overlay" aria-hidden="true"></div>

  <!-- Root das telas (gerenciado pelo ScreenManager) -->
  <main id="app" class="app"></main>

  <!-- Tela de carregamento inicial -->
  <div id="boot" class="boot">
    <div class="boot__logo">BRASIL<span>ONLINE</span></div>
    <div class="boot__bar"><span></span></div>
    <div class="boot__hint">Carregando experiência…</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
